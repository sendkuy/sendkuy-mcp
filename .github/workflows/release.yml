name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:versions
      - name: package.json version matches the tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "package.json says ${version}, the tag is ${GITHUB_REF_NAME}"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
      - name: Publish to npm unless this version is already there
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "@sendkuy/mcp@${version}" version >/dev/null 2>&1; then
            echo "@sendkuy/mcp@${version} is already on npm"
          else
            npm publish --provenance --access public
          fi
      - run: npm run pack:mcpb
      - run: gh release create "$GITHUB_REF_NAME" sendkuy-mcp.mcpb --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login dns --domain sendkuy.com --private-key "${MCP_REGISTRY_PRIVATE_KEY}"
          ./mcp-publisher publish
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
